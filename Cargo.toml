[package]
name         = "relative-age-display"
version      = "0.6.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/relative-age-display"
description  = "Human-readable relative-age display: an elapsed span rendered as its single most-significant unit with two decimals."
publish      = false

[lib]
name = "relative_age_display"
path = "src/lib.rs"

[features]
default = ["datom"]
datom = ["dep:protos"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "5cd6219", features = ["rkyv"] }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3", features = ["rkyv"], optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "5a5daca" }

[[test]]
name = "rendering"
path = "tests/rendering.rs"

[[test]]
name = "datom_text"
path = "tests/datom_text.rs"
required-features = ["datom"]

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
