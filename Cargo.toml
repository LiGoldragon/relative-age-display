[package]
name         = "relative-age-display"
version      = "0.5.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/relative-age-display"
description  = "Human-readable relative-age display: an elapsed span rendered as its single most-significant unit with two decimals."
publish      = false

[lib]
name = "relative_age_display"
path = "src/lib.rs"

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "41a3c073d5c5" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "2d999f173334" }

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "bcf728bbe4521e663f4773d3c1fd4ebb643df32e" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
